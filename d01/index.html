<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ares Digital</title>
<!--
  DISPLAY D01
  Para activarlo: pega el link del cliente entre las comillas de DESTINO y haz Commit.
  Si DESTINO queda vacío, se muestra "Display aún no activado".
-->
<script>
  var DESTINO = "https://search.google.com/local/writereview?placeid=ChIJj8gQ5JU9rZER3nh_Mg5diRE";
  if (DESTINO) window.location.replace(DESTINO);
</script>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:16px; background:#111111; color:#FFFFFF;
         font-family:Inter, system-ui, sans-serif; text-align:center; padding:16px; box-sizing:border-box; }
  h1 { font-size:22px; margin:0; letter-spacing:2px; } h1 span { color:#E4572E; }
  a { background:#E4572E; color:#FFFFFF; text-decoration:none; font-weight:600; padding:14px 26px; border-radius:10px; }
  p { color:#FACC15; font-size:14px; margin:0; }
</style>
</head>
<body>
  <h1>ARES <span>DIGITAL</span></h1>
  <p id="msg">Te estamos llevando…</p>
  <a id="boton" href="#">Toca aquí si no avanza</a>
  <script>
    if (!DESTINO) { document.getElementById("msg").textContent = "Display D01 · aún no activado";
                    document.getElementById("boton").style.display = "none"; }
    else document.getElementById("boton").href = DESTINO;
  </script>
</body>
</html>
